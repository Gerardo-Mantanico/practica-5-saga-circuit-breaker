services:
  postgres:
    image: postgres:16
    container_name: practica5-postgres
    environment:
      POSTGRES_DB: practica5
      POSTGRES_USER: practica5
      POSTGRES_PASSWORD: practica5
    ports:
      - "5432:5432"
    volumes:
      - practica5-pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practica5 -d practica5"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  practica5-pgdata:
